# Default: auto iso/aniso from variography heuristics
# Override: isotropy_mode: force_iso | force_aniso  (or legacy isotropic: true/false)
isotropy_mode: auto

auto_isotropy:
  # a_maj/a_min below this → ISO (no clear elongation)
  anisotropy_ratio_min: 1.3
  # max(omni, directional) nugget/sill at or above this → ISO (hard noise)
  nugget_frac_iso: 0.45
  # domains smaller than this → ISO (unstable directional MOI)
  aniso_min_points: 80
  # fewer experimental lag bins on major or minor → ISO
  min_directional_lags: 4
  # major vs minor partial-sill ratio above this → ISO (inconsistent axes)
  sill_ratio_max: 2.5

n_min_points: 15

variogram_map:
  n_lags: 16
  max_dist_percentile: 50.0

moi:
  max_lag_fraction: 0.8
  eps: 1.0e-8

rose:
  step_deg: 15.0
  n_lags: 10
  max_dist_percentile: 50.0
  min_pairs: 10

directional:
  tolerance_deg: 20.0
  n_lags: 12
  max_dist_percentile: 50.0
  min_pairs: 8

search_space:
  radius_margin: 0.90
  nugget_margin: 0.60
  range_scale_min: 0.10
  range_scale_max: 1.90
  nmax_min: 5
  nmax_max: 80

# Production CV only: spatial_block | buffered_delete_d
# Legacy (loo/kfold5/buffer/delete_d) require cv.allow_legacy: true
cv:
  method: spatial_block
  grid_nx: 3
  grid_ny: 3
  seed: 42

delete_d:
  holdout_size: null
  n_repeats: 25
  seed: 42


outer_holdout:
  # Post-hoc monitor only: split first; VG/MOI/CV on train; score outer once after Optuna.
  # Never used for θ selection or early stop.
  enabled: true
  method: spatial  # spatial | random
  fraction: 0.15
  min_points: 10
  max_fraction: 0.20
  min_train: 20
  grid_nx: 3
  grid_ny: 3
  seed: 43


optuna:
  n_trials: 120
  seed: 42
  n_startup_trials: null
  n_ei_candidates: 64
  invalid_penalty: 1000000.0
