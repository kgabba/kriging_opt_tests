# Walker: aniso OK + buffered delete-d CV
# Buffer = 0.5 * a_major in OK anisotropy metric (half practical range)
isotropic: false

n_min_points: 15

variogram_map:
  n_lags: 16
  max_dist_percentile: 50.0

moi:
  max_lag_fraction: 0.8
  eps: 1.0e-8

rose:
  step_deg: 15.0
  n_lags: 10
  max_dist_percentile: 50.0
  min_pairs: 10

directional:
  tolerance_deg: 20.0
  n_lags: 12
  max_dist_percentile: 50.0
  min_pairs: 8

search_space:
  radius_margin: 0.20
  radius_prior_scale: 1.5
  nugget_margin: 0.20
  range_scale_min: 0.80
  range_scale_max: 1.20
  nmax_min: 5
  nmax_max: 40

cv:
  method: buffered_delete_d
  holdout_size: null
  n_repeats: 25
  buffer_scale: 0.5
  buffer_anisotropic: true
  seed: 42

optuna:
  n_trials: 800
  seed: 42
  n_startup_trials: null
  n_ei_candidates: 64
  invalid_penalty: 1000000.0
