# Walker: auto iso/aniso + spatial_block CV
isotropy_mode: auto

auto_isotropy:
  anisotropy_ratio_min: 1.3
  nugget_frac_iso: 0.45
  aniso_min_points: 80
  min_directional_lags: 4
  sill_ratio_max: 2.5

n_min_points: 15

variogram_map:
  n_lags: 16
  max_dist_percentile: 50.0

moi:
  max_lag_fraction: 0.8
  eps: 1.0e-8

rose:
  step_deg: 15.0
  n_lags: 10
  max_dist_percentile: 50.0
  min_pairs: 10

directional:
  tolerance_deg: 20.0
  n_lags: 12
  max_dist_percentile: 50.0
  min_pairs: 8

search_space:
  radius_margin: 0.90
  # ISO only: R centre = a_iso * this. ANISO ignores it (R_major centre = a_major).
  radius_prior_scale: 1.5
  nugget_margin: 0.60
  range_scale_min: 0.10
  range_scale_max: 1.90
  nmax_min: 5
  nmax_max: 80

cv:
  method: spatial_block
  grid_nx: 3
  grid_ny: 3
  seed: 42


outer_holdout:
  enabled: true
  fraction: 0.15
  min_points: 10
  max_fraction: 0.20
  min_train: 20
  seed: 43
  patience: 300

optuna:
  n_trials: 1200
  seed: 42
  n_startup_trials: null
  n_ei_candidates: 64
  invalid_penalty: 1000000.0
