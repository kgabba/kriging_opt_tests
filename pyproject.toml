[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aniso-ok-tuner"
version = "0.1.0"
description = "Domain-wise anisotropic OK tuner: MOI priors + Optuna delete-d (trial logs)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "optuna>=3.0",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[project.scripts]
aniso-ok-tuner = "aniso_ok_tuner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aniso_ok_tuner*"]
